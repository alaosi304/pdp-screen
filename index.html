<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="slide-version" content="2026-11-01-6">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آراء المتدربين — دورة حماية البيانات الشخصية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#081230;--ink:#f3f6fc;--mute:#a7b6d3;--line:rgba(255,255,255,.13);--gold:#e0a23a;--goldL:#f6d48c;--green:#2fa77d;--mint:#9ff0cf;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#081230;--ink:#f3f6fc}}
:root[data-theme="dark"]{--bg1:#081230;--ink:#f3f6fc}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg1);overflow:hidden}
body{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body.idle{cursor:none}

.vp{position:fixed;top:0;right:0;bottom:0;left:0;direction:ltr;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,#0c1a46 0%,#081230 60%,#040918 100%)}
.glow{position:absolute;border-radius:50%}
.g1{width:80vw;height:80vw;left:-30vw;top:-36vw;opacity:.75;background:radial-gradient(circle,#1d4fb0 0%,rgba(0,0,0,0) 66%);animation:d1 28s ease-in-out infinite alternate}
.g2{width:70vw;height:70vw;right:-26vw;bottom:-32vw;opacity:.6;background:radial-gradient(circle,#14735a 0%,rgba(0,0,0,0) 66%);animation:d2 34s ease-in-out infinite alternate}
.g3{width:46vw;height:46vw;left:30vw;top:20vh;opacity:.35;background:radial-gradient(circle,#3b2f9a 0%,rgba(0,0,0,0) 66%);animation:d3 24s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(12vw,10vh)}}
@keyframes d2{to{transform:translate(-10vw,-8vh)}}
@keyframes d3{to{transform:translate(-16vw,12vh)}}
.grid{position:absolute;top:0;right:0;bottom:0;left:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:64px 64px}
canvas#sky{position:absolute;top:0;left:0;width:100%;height:100%}
.vign{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(2,5,16,.6))}

.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;direction:rtl}

/* header */
.top{position:absolute;top:40px;left:64px;right:64px;height:92px;display:flex;align-items:center;justify-content:space-between;opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) .1s forwards}
.brand{display:flex;align-items:center}
.ic{width:66px;height:66px;border-radius:18px;margin-left:20px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#2fa77d,#123a7a);box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 14px 40px rgba(47,167,125,.35);animation:icp 4s ease-in-out infinite}
@keyframes icp{50%{box-shadow:0 0 0 1px rgba(255,255,255,.16) inset,0 14px 60px rgba(47,167,125,.6)}}
.logo{height:92px;width:auto;display:block}
.sep{width:1px;height:72px;background:rgba(255,255,255,.22);margin:0 30px}
.dept{font-size:19px;color:var(--mint);font-weight:500}
.prog{font-size:40px;font-weight:700;line-height:1.25}
.tag{display:flex;align-items:center;font-size:22px;font-weight:600;color:var(--goldL);margin-top:4px}
.deptL{font-size:36px;font-weight:700;color:#fff;padding:14px 34px;border-radius:20px;border:1px solid rgba(159,240,207,.45);background:linear-gradient(135deg,rgba(47,167,125,.22),rgba(29,79,176,.18));box-shadow:0 0 40px rgba(47,167,125,.18);animation:dp 4s ease-in-out infinite}
@keyframes dp{50%{box-shadow:0 0 60px rgba(47,167,125,.35)}}
.tag .ln{width:0;height:2px;background:var(--gold);margin-left:14px;animation:grow 1.2s cubic-bezier(.7,0,.2,1) .8s forwards}
@keyframes growS{to{width:48px}}
@keyframes grow{to{width:48px}}

/* cards */
.slot{position:absolute;opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.fl{width:100%;height:100%;animation:flo 7s ease-in-out infinite alternate}
@keyframes flo{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.card{position:relative;width:100%;height:100%;border-radius:26px;padding:30px 32px 26px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));background-color:rgba(12,24,64,.6);
  border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.35);
  transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .9s,border-color .9s,box-shadow .9s}
.dim .card{opacity:.72}
.on .card{transform:scale(1.03);border-color:rgba(246,212,140,.65);box-shadow:0 30px 90px rgba(0,0,0,.45),0 0 0 1px rgba(246,212,140,.3),0 0 60px rgba(224,162,58,.22)}
.qm{width:40px;height:32px;flex:none;opacity:.85;margin-bottom:12px;transition:transform .9s}
.on .qm{transform:scale(1.15)}
.txt{flex:1;font-size:20px;line-height:1.78;color:#e6edf9}
.short .card{justify-content:center;align-items:center;text-align:center;padding:22px 96px}
.short .txt{flex:none;font-size:31px;line-height:1.5;font-weight:600;color:#fff}
.short .qm{position:absolute;top:24px;right:30px;margin:0;width:46px;height:37px}
.w{display:inline-block;opacity:0;transform:translateY(14px);animation:win .6s cubic-bezier(.16,1,.3,1) forwards}
@keyframes win{to{opacity:1;transform:none}}
.hl{color:#fff;font-weight:600;transition:color .6s}
.on .hl{color:var(--goldL)}
.by{display:flex;align-items:center;font-size:18px;font-weight:600;padding-top:14px;margin-top:12px;border-top:1px solid var(--line);color:#fff}
.short .by{border:0;padding-top:4px;margin-top:10px;font-size:18px}
.by .ln{width:26px;height:2px;background:var(--gold);margin-left:12px;transition:width .8s}
.on .by .ln{width:52px}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.05)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--goldL));transform-origin:right;transform:scaleX(0)}
.shine{position:absolute;top:0;bottom:0;width:160px;left:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.08),rgba(255,255,255,0));pointer-events:none}
.on .shine{animation:sh 1.8s cubic-bezier(.4,0,.2,1) .2s}
@keyframes sh{from{transform:translateX(0)}to{transform:translateX(-900px)}}

.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);direction:rtl;font-size:13px;color:#c9d5ea;
  background:rgba(8,18,48,.85);border:1px solid var(--line);padding:8px 16px;border-radius:999px;transition:opacity .8s;z-index:5}
body.idle .hint{opacity:0}
@media (prefers-reduced-motion:reduce){.glow,.fl{animation:none!important}}
</style>
</head>

 {n:"جود حمود القرعاني",x:64,y:150,w:474,h:504,
  t:"أحد أهم محركات النجاح التقني هو [الامتثال لحوكمة البيانات وحماية خصوصيتها]. سعدت بإتمام دورة حماية البيانات الشخصية (PDPL) المقدمة من سدايا: [فهم الأطر التنظيمية لنظام حماية البيانات الشخصية]، و[التمييز العملي بين أدوار جهة التحكم وجهة المعالجة]. خطوة جديدة ومعرفة أعمق تسهم في [تعزيز الأمان والامتثال الرقمي]."},
 {n:"محمد بن عمر بن محمد مجلي",x:812,y:678,w:724,h:176,s:1,
  t:"دورة تدريبية [فاخرة] و[نقلة معرفية نوعية]. شكرًا لجهودكم."},
 {n:"محمد عبدالله سليمان الحماد",x:64,y:678,w:724,h:176,s:1,
  t:"جزاكم الله خيرًا، دورة [أكثر من رائعة]."}
];
var ORDER=[3,0,4,1,2]; /* spotlight order: short, long, short, long, long */
function $(id){return document.getElementById(id);}
function addC(el,c){if(el&&(" "+el.className+" ").indexOf(" "+c+" ")<0)el.className+=" "+c;}
function remC(el,c){if(el)el.className=(" "+el.className+" ").replace(new RegExp(" "+c+" ","g")," ").replace(/^\s+|\s+$/g,"");}
function setT(el,v){el.style.webkitTransform=v;el.style.transform=v;}
function setTr(el,v){el.style.webkitTransition=v;el.style.transition=v;}

var stage=$("stage");
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;
  setT(stage,"translate(-50%,-50%) scale("+Math.min(w/1600,h/900)+")");}
window.addEventListener("resize",fit);fit();setTimeout(fit,500);

var QM='<svg class="qm" viewBox="0 0 100 80" fill="#f6d48c"><path d="M0 80V48C0 22 14 6 40 0l5 10C30 15 23 25 22 38h20v42H0zm56 0V48C56 22 70 6 96 0l4 10c-15 5-22 15-23 28h20v42H56z"/></svg>';
function words(t,base,step){var hl=false,g=-1,out=[],p=t.split(/\s+/);
  for(var k=0;k<p.length;k++){var w=p[k];if(w.indexOf("[")>-1){hl=true;g++;}
    var d=Math.round(base+k*step),st="-webkit-animation-delay:"+d+"ms;animation-delay:"+d+"ms";
    if(hl)st+=";-webkit-transition-delay:"+(g*350)+"ms;transition-delay:"+(g*350)+"ms";
    out.push('<span class="w'+(hl?" hl":"")+'" style="'+st+'">'+w.replace(/[\[\]]/g,"")+'</span>');
    if(w.indexOf("]")>-1)hl=false;}
  return out.join(" ");}

var html="";
for(var i=0;i<DATA.length;i++){var d=DATA[i],delay=300+i*180;
  html+='<div class="slot'+(d.s?" short":"")+'" id="s'+i+'" style="left:'+d.x+'px;top:'+d.y+'px;width:'+d.w+'px;height:'+d.h+'px;-webkit-animation-delay:'+delay+'ms;animation-delay:'+delay+'ms">'+
   '<div class="fl" style="-webkit-animation-delay:-'+(i*1.7)+'s;animation-delay:-'+(i*1.7)+'s"><div class="card">'+QM+
   '<div class="txt">'+words(d.t,delay+400,d.s?60:14)+'</div>'+
   '<div class="by"><span class="ln"></span>'+d.n+'</div><div class="bar"><i></i></div><div class="shine"></div></div></div></div>';}
$("cards").innerHTML=html;

/* stars (light) */
(function(){var cv=$("sky");if(!cv.getContext)return;var cx=cv.getContext("2d"),W,H,S=[];
  function rs(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;S=[];
    for(var i=0;i<90;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,v:Math.random()*.15+.05,a:Math.random()});}
  rs();window.addEventListener("resize",rs);
  var raf=window.requestAnimationFrame||window.webkitRequestAnimationFrame||function(f){return setTimeout(f,33);};
  function f(){cx.clearRect(0,0,W,H);
    for(var i=0;i<S.length;i++){var s=S[i];s.y-=s.v;s.a+=.01;if(s.y<-4){s.y=H+4;s.x=Math.random()*W;}
      cx.fillStyle="rgba(190,225,255,"+(.35+.35*Math.sin(s.a))+")";cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();}
    raf(f);}
  f();})();

/* spotlight cycle */
var step=-1,reloadPending=false,startedAt=new Date().getTime();
function durFor(d){return d.s?6000:Math.min(13000,5000+d.t.split(/\s+/).length*95);}
function spot(){step=(step+1)%ORDER.length;
  if(step===0&&reloadPending){location.reload();return;}
  var idx=ORDER[step];
  for(var i=0;i<DATA.length;i++){var el=$("s"+i),b=el.getElementsByTagName("i")[0];
    if(i===idx){remC(el,"dim");addC(el,"on");}else{remC(el,"on");addC(el,"dim");}
    setTr(b,"none");setT(b,"scaleX(0)");}
  var bar=$("s"+idx).getElementsByTagName("i")[0],dur=durFor(DATA[idx]);void bar.offsetWidth;
  setTr(bar,"-webkit-transform "+dur+"ms linear, transform "+dur+"ms linear");setT(bar,"scaleX(1)");
  setTimeout(spot,dur);}
setTimeout(spot,4200);

/* fullscreen, cursor, wake */
function toggleFS(){var d=document,el=d.documentElement;try{
  if(!(d.fullscreenElement||d.webkitFullscreenElement)){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
  else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);}}catch(e){}}
document.addEventListener("click",toggleFS);
var idleT;document.addEventListener("mousemove",function(){remC(document.body,"idle");clearTimeout(idleT);idleT=setTimeout(function(){addC(document.body,"idle");},3000);});
try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request("screen").then(null,function(){});}catch(e){}

/* auto-update */
var myVer=(document.querySelector('meta[name="slide-version"]')||{}).content;
function checkUpdate(){try{var x=new XMLHttpRequest();x.open("GET",location.pathname+"?v="+new Date().getTime(),true);
  x.onload=function(){var m=/name="slide-version" content="([^"]+)"/.exec(x.responseText||"");if(x.status==200&&m&&m[1]!==myVer)reloadPending=true;};x.send();}catch(e){}}
setInterval(checkUpdate,180000);
setInterval(function(){if(new Date().getTime()-startedAt>6*3600000)reloadPending=true;},600000);
})();
</script>

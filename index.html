<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="slide-version" content="2026-11-01-1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آراء المتدربين — دورة حماية البيانات الشخصية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --c1{syntax:"<color>";inherits:true;initial-value:#1b3f8f}
@property --c2{syntax:"<color>";inherits:true;initial-value:#14735a}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{color-scheme:dark;--bg1:#081230;--bg2:#0b1840;--ink:#f3f6fc;--mute:#9fb0cf;--line:rgba(255,255,255,.13);--gold:#e0a23a;--goldL:#f6d48c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#081230;--ink:#f3f6fc}}
:root[data-theme="dark"]{--bg1:#081230;--ink:#f3f6fc}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg1);overflow:hidden}
body{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body.idle{cursor:none}

.vp{position:fixed;inset:0;direction:ltr;overflow:hidden;--c1:#1b3f8f;--c2:#14735a;transition:--c1 2.4s,--c2 2.4s;
  background:radial-gradient(120% 90% at 70% 10%,var(--bg2) 0%,var(--bg1) 60%,#040918 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform}
.g1{width:55vw;height:55vw;background:var(--c1);opacity:.6;left:-14vw;top:-20vw;animation:d1 24s ease-in-out infinite alternate}
.g2{width:44vw;height:44vw;background:var(--c2);opacity:.45;right:-12vw;bottom:-18vw;animation:d2 30s ease-in-out infinite alternate}
.g3{width:26vw;height:26vw;background:#3a3fa8;opacity:.25;left:42vw;top:32vh;animation:d3 20s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(16vw,12vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-14vw,-10vh) scale(1.1)}}
@keyframes d3{to{transform:translate(-20vw,14vh) scale(.8)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 50%,#000 15%,transparent 72%)}
.wall{position:absolute;inset:-35%;display:flex;gap:30px;justify-content:center;transform:perspective(1400px) rotateX(24deg) rotateZ(-11deg);opacity:.05;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 68%);mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 68%)}
.col{width:300px;flex:none;overflow:hidden}
.track{display:flex;flex-direction:column;gap:22px;animation:up 90s linear infinite}
.col:nth-child(even) .track{animation-name:down;animation-duration:110s}
@keyframes up{to{transform:translateY(-50%)}}
@keyframes down{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.mini{direction:rtl;background:#fff;color:#0b1840;border-radius:18px;padding:20px 22px;font-size:15px;line-height:1.75}
canvas#sky{position:absolute;inset:0;width:100%;height:100%}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(220,240,255,.32),transparent 60%)}
.flash.go{animation:fl 1s ease-out}
@keyframes fl{18%{opacity:1}100%{opacity:0}}
.streak{position:absolute;top:50%;left:-10%;width:120%;height:2px;pointer-events:none;opacity:0;transform:scaleX(0);
  background:linear-gradient(90deg,transparent,#bfe9ff 30%,#fff 50%,var(--goldL) 70%,transparent);box-shadow:0 0 24px 4px rgba(190,230,255,.55)}
.streak.go{animation:st 1s cubic-bezier(.7,0,.2,1)}
@keyframes st{35%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1) scaleY(.1)}}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(2,5,16,.65))}

.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;direction:rtl}

/* header */
.top{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center;opacity:0;transform:translateY(-14px);transition:opacity 1s,transform 1s}
.top.on{opacity:1;transform:none}
.brand{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--mute)}
.brand strong{color:var(--ink);font-weight:600;font-size:19px;display:block}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#2fa77d,#123a7a);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 30px rgba(47,167,125,.3)}

/* intro */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;pointer-events:none}
.intro.on{opacity:1}
.intro svg{width:120px;height:120px;filter:drop-shadow(0 0 30px rgba(127,224,189,.55))}
.intro.on svg path,.intro.on svg rect{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.intro.on svg rect{animation-delay:.6s}
@keyframes draw{to{stroke-dashoffset:0}}
.it{font-size:150px;font-weight:700;line-height:1.2;background:linear-gradient(100deg,#fff 25%,var(--goldL) 45%,#9ff0cf 55%,#fff 75%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.intro.on .it{animation:wipe 1.4s cubic-bezier(.7,0,.2,1) .5s both,shine 4s linear 1.9s infinite}
@keyframes wipe{from{clip-path:inset(-20% 0 -20% 100%);filter:blur(16px);transform:scale(1.08)}to{clip-path:inset(-20% 0 -20% 0);filter:none;transform:none}}
@keyframes shine{from{background-position:110% 0}to{background-position:-160% 0}}
.is{font-size:32px;color:var(--mute);font-weight:400;opacity:0}
.intro.on .is{animation:rise 1s cubic-bezier(.2,.7,.2,1) 1.5s forwards}
.iline{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.intro.on .iline{animation:grow 1.4s cubic-bezier(.7,0,.2,1) 1.2s forwards}
@keyframes grow{to{width:520px}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* quote scene */
.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.scene.on{opacity:1}
.cam{position:absolute;inset:0;animation:cam 16s ease-in-out infinite alternate;transform-style:preserve-3d}
@keyframes cam{from{transform:perspective(2000px) rotateY(1.6deg) rotateX(-.8deg) scale(1)}to{transform:perspective(2000px) rotateY(-1.6deg) rotateX(.8deg) scale(1.02)}}
.out-z{animation:outz .95s cubic-bezier(.7,0,.84,0) forwards!important}
@keyframes outz{to{opacity:0;transform:scale(1.22);filter:blur(16px)}}

.hero{position:absolute;left:140px;right:140px;top:0;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:transform 1.15s cubic-bezier(.75,0,.2,1)}
.scene.s2 .hero{transform:translateY(-262px) scale(.46)}
.h{text-wrap:balance;font-size:92px;font-weight:700;line-height:1.3;background:linear-gradient(100deg,#fff 25%,var(--goldL) 45%,#fff 70%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:heroIn 1.4s cubic-bezier(.16,1,.3,1) both,shine 3.6s linear 1.2s infinite}
@keyframes heroIn{from{opacity:0;transform:scale(1.6);filter:blur(26px)}to{opacity:1;transform:none;filter:none}}
.qm{width:90px;margin-bottom:18px;opacity:0;animation:qmIn 1s cubic-bezier(.16,1,.3,1) .1s forwards}
@keyframes qmIn{from{opacity:0;transform:translateY(-30px) scale(.6)}to{opacity:.9;transform:none}}
.scene.s2 .qm{opacity:0!important;transition:opacity .4s}

/* solo (short quote) */
.solo{text-wrap:balance;font-size:84px;font-weight:600;line-height:1.45;color:#fff;max-width:1250px}
.solo .w{transform-origin:50% 100%}

.card{position:absolute;left:140px;width:1320px;top:292px;height:540px;border-radius:36px;padding:52px 90px 40px;display:flex;flex-direction:column;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 50px 140px rgba(0,0,0,.5);
  clip-path:inset(50% 0 50% 0 round 36px);opacity:0;transition:clip-path 1.05s cubic-bezier(.75,0,.2,1),opacity .35s}
.scene.s2 .card{clip-path:inset(0 0 0 0 round 36px);opacity:1}
.card::before{content:"";position:absolute;inset:-1px;border-radius:37px;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 68%,rgba(127,224,189,.95) 80%,rgba(224,162,58,.95) 88%,transparent 96%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 8s linear infinite}
@keyframes spin{to{--a:360deg}}
.qt{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}
.qt p{text-wrap:pretty;font-size:33px;line-height:1.75;color:#e9f0fb}

.w{display:inline-block;opacity:0;transform:perspective(700px) rotateX(-85deg) translateY(26px);transform-origin:50% 100%;filter:blur(6px);
  animation:win .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes win{to{opacity:1;transform:none;filter:none}}
.w.hl{transition:color .7s,text-shadow .7s}
.lit .w.hl{color:var(--goldL);text-shadow:0 0 22px rgba(246,212,140,.55)}

.by{display:flex;align-items:center;justify-content:center;gap:16px;font-size:28px;opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}
.by.on{opacity:1;transform:none}
.by .ln{width:0;height:2px;background:var(--gold);transition:width 1s cubic-bezier(.7,0,.2,1) .2s}
.by.on .ln{width:56px}
.by b{font-weight:600}
.by small{font-size:16px;color:var(--mute)}
.card .by{padding-top:22px}
.solo-by{position:absolute;left:0;right:0;top:700px}

.prog{position:absolute;left:0;right:0;top:862px;display:flex;justify-content:center;gap:10px}
.seg{width:46px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.seg i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldL));transform-origin:right;transform:scaleX(0)}
.seg.done i{transform:scaleX(1);background:rgba(255,255,255,.45)}
.prog{opacity:0;transition:opacity 1s}.prog.on{opacity:1}

.hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);direction:rtl;font-size:13px;color:#c9d5ea;
  background:rgba(8,18,48,.85);border:1px solid var(--line);padding:8px 16px;border-radius:999px;transition:opacity .8s;z-index:5}
body.idle .hint{opacity:0}
@media (prefers-reduced-motion:reduce){.glow,.track,.cam,.card::before{animation:none!important}}
</style>
</head>
<body class="idle">
<div class="vp" id="vp">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="grid"></div>
  <div class="wall" id="wall"></div>
  <canvas id="sky"></canvas>
  <div class="vign"></div>

  <div class="stage" id="stage">
    <header class="top" id="top">
      <div class="brand">
        <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><rect x="9" y="10.5" width="6" height="5" rx="1"/><path d="M10.2 10.5V9a1.8 1.8 0 013.6 0v1.5"/></svg></div>
        <div><strong>آراء المتدربين</strong>دورة حماية البيانات الشخصية</div>
      </div>
    </header>

    <section class="intro" id="intro">
      <svg viewBox="0 0 24 24" fill="none" stroke="#bff3dc" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><rect x="9" y="10.5" width="6" height="5" rx="1"/></svg>
      <div class="it">آراء المتدربين</div>
      <div class="iline"></div>
      <div class="is">دورة حماية البيانات الشخصية · منصة أذكى X</div>
    </section>

    <section class="scene" id="scene"><div class="cam" id="cam"></div></section>
    <div class="prog" id="prog"></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="streak" id="streak"></div>
</div>
<div class="hint">انقر لملء الشاشة · ← → للتنقل · مسافة للإيقاف</div>

<script>
/* [نص] = عبارة تضيء بالذهبي */
const DATA=[
 {n:"محمد بن عمر بن محمد مجلي",s:"منصة أذكى X",c:["#1d4fb0","#14735a"],
  t:"دورة تدريبية [فاخرة] و[نقلة معرفية نوعية]. شكرًا لجهودكم."},
 {n:"أمل قاسم إسماعيل دراج",s:"منصة أذكى X",c:["#3b2f9a","#1f7fa0"],
  h:"من أمتع الدورات التي تعلمت عليها في حياتي",
  t:"بصراحة من أمتع الدورات والحقائب التدريبية الإلكترونية التي تعلمت عليها في حياتي: [وضوح في السردية وطريقة التعلم]، و[تنوع في التطبيقات والأمثلة الواقعية]. مع طول مدة الدورة إلا أنها [متميزة ورائعة]، ولا يمكن أن أصفها بغير هذا الوصف. شكرًا سدايا، لقد أوضحتم لنا ما لم يوضحه النظام ولا اللائحة ولا الدليل الاسترشادي ولا المنصة، لكنكم [أبدعتم في هذه الحقيبة]. شكرًا لكم على هذه الاحترافية، شكرًا أكاديمية سدايا."},
 {n:"محمد عبدالله سليمان الحماد",s:"منصة أذكى X",c:["#7a4a12","#1b3f8f"],
  t:"جزاكم الله خيرًا، دورة [أكثر من رائعة]."},
 {n:"رائد عبدالرحمن عبدالكريم الديحان",s:"منصة أذكى X",c:["#0f6a6a","#2a3fa0"],
  h:"التنوع في الأساليب كسر حاجز الملل",
  t:"كان محتوى جيدًا، وأعجبني جدًا أسلوب تقديم الورشة من حيث التنوع في الأساليب مثل [المقاطع المرئية المتفاعلة]، وتنوع أساليب الأنشطة مثل [البطاقات والسيناريوهات التفاعلية]، والتي بدورها [كسرت حاجز الملل] لو كان التقديم كله مقاطع مرئية. [أفكار رائعة وأساليب متنوعة]، مع الشكر والتقدير لكم على توفير هذه الورش في مجال حماية البيانات الشخصية وحوكمة البيانات، وسعيد بتمكني من الاستفادة منها."},
 {n:"جود حمود القرعاني",s:"منشور على LinkedIn",c:["#1a5aa8","#5b3fa8"],
  h:"خطوة جديدة ومعرفة أعمق",
  t:"أحد أهم محركات النجاح التقني هو [الامتثال لحوكمة البيانات وحماية خصوصيتها]. سعدت بإتمام دورة حماية البيانات الشخصية (PDPL) المقدمة من منصة أذكى X التابعة لسدايا: فهم الأطر التنظيمية لنظام حماية البيانات الشخصية، و[التمييز العملي بين أدوار جهة التحكم وجهة المعالجة]. خطوة جديدة ومعرفة أعمق تسهم في [تعزيز الأمان والامتثال الرقمي]."}
];
const $=id=>document.getElementById(id);
const stage=$("stage");
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);fit();

/* wall: quotes only */
(function(){const wall=$("wall");for(let c=0;c<7;c++){const col=document.createElement("div");col.className="col";const tr=document.createElement("div");tr.className="track";
  let h="";for(let k=0;k<2;k++)for(let i=0;i<DATA.length;i++)h+=`<div class="mini">${DATA[(i+c)%DATA.length].t.replace(/[\[\]]/g,"")}</div>`;
  tr.innerHTML=h;tr.style.animationDelay=(-c*13)+"s";col.appendChild(tr);wall.appendChild(col)}})();

/* words with highlight groups */
function words(t,step){let hl=false,g=-1,out=[],k=0;
  t.split(/\s+/).forEach(w=>{let open=w.includes("["),close=w.includes("]");if(open){hl=true;g++}
    const clean=w.replace(/[\[\]]/g,"");
    out.push(`<span class="w${hl?" hl":""}" style="animation-delay:${Math.round(k*step)}ms${hl?`;transition-delay:${g*450}ms`:""}">${clean}</span>`);k++;
    if(close)hl=false});
  return {html:out.join(" "),n:k}}

/* progress segments */
$("prog").innerHTML=DATA.map(()=>`<div class="seg"><i></i></div>`).join("");
const segs=[...document.querySelectorAll(".seg")];

/* starfield with warp */
const sky=(function(){const cv=$("sky"),cx=cv.getContext("2d");let W,H,S=[],speed=.0018,target=.0018;
  function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;
    S=Array.from({length:320},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random()*.95+.05}))}
  rs();addEventListener("resize",rs);
  (function f(){speed+=(target-speed)*.08;const cxw=W/2,cyh=H/2,F=Math.min(W,H)*.5;
    cx.fillStyle=speed>.006?"rgba(5,10,30,.35)":"rgba(0,0,0,0)";cx.clearRect(0,0,W,H);
    for(const s of S){const pz=s.z;s.z-=speed;if(s.z<=.02){s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;s.z=1;continue}
      const x=cxw+s.x/s.z*F,y=cyh+s.y/s.z*F,px=cxw+s.x/pz*F,py=cyh+s.y/pz*F,a=Math.min(1,(1-s.z)*1.3);
      if(speed>.005){cx.strokeStyle=`rgba(190,230,255,${a*.8})`;cx.lineWidth=(1-s.z)*2.2*devicePixelRatio;cx.beginPath();cx.moveTo(px,py);cx.lineTo(x,y);cx.stroke()}
      else{cx.fillStyle=`rgba(190,225,255,${a*.75})`;cx.beginPath();cx.arc(x,y,(1-s.z)*1.6*devicePixelRatio,0,7);cx.fill()}}
    requestAnimationFrame(f)})();
  return{warp(ms){target=.05;setTimeout(()=>target=.0018,ms)}}})();

function burst(){sky.warp(700);
  ["flash","streak"].forEach(id=>{const e=$(id);e.classList.remove("go");void e.offsetWidth;e.classList.add("go")});
  document.querySelectorAll(".track").forEach(t=>t.getAnimations().forEach(a=>{a.updatePlaybackRate(14);setTimeout(()=>a.updatePlaybackRate(1),900)}))}

/* timeline */
let timers=[],cur=-1,paused=false,barAnim=null;
const T=(fn,ms)=>timers.push(setTimeout(fn,ms));
const clearAll=()=>{timers.forEach(clearTimeout);timers=[]};
const QM=`<svg class="qm" viewBox="0 0 100 80" fill="#f6d48c"><path d="M0 80V48C0 22 14 6 40 0l5 10C30 15 23 25 22 38h20v42H0zm56 0V48C56 22 70 6 96 0l4 10c-15 5-22 15-23 28h20v42H56z"/></svg>`;

function setColors(c){const vp=$("vp");vp.style.setProperty("--c1",c[0]);vp.style.setProperty("--c2",c[1])}
function progress(i,dur){segs.forEach((s,k)=>{s.classList.toggle("done",k<i);s.querySelector("i").getAnimations().forEach(a=>a.cancel())});
  if(i<0)return;barAnim=segs[i].querySelector("i").animate([{transform:"scaleX(0)"},{transform:"scaleX(1)"}],{duration:dur,easing:"linear",fill:"forwards"});if(paused)barAnim.pause()}


/* auto-update: checks for a new version every 3 minutes, reloads at the start of the next round */
let reloadPending=false;const startedAt=Date.now();
const myVer=(document.querySelector('meta[name="slide-version"]')||{}).content;
async function checkUpdate(){try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;
  const m=(await r.text()).match(/name="slide-version" content="([^"]+)"/);if(m&&m[1]!==myVer)reloadPending=true}catch(e){}}
setInterval(checkUpdate,180000);
setInterval(()=>{if(Date.now()-startedAt>6*3600e3)reloadPending=true},600000);

function intro(){if(reloadPending){location.reload();return}setColors(["#1b3f8f","#14735a"]);$("top").classList.remove("on");$("prog").classList.remove("on");
  const it=$("intro");it.classList.remove("on","out-z");void it.offsetWidth;it.classList.add("on");progress(-1);
  T(()=>leave(it,()=>{it.classList.remove("on","out-z");next()}),5600)}

function quote(i){const d=DATA[i],sc=$("scene"),cam=$("cam");setColors(d.c);
  $("top").classList.add("on");$("prog").classList.add("on");
  sc.className="scene on";cam.classList.remove("out-z");
  const by=`<div class="by"><span class="ln"></span><b>${d.n}</b><small>· ${d.s}</small></div>`;
  let dur;
  if(!d.h){ // solo: whole quote is the hero
    const W=words(d.t,140);
    cam.innerHTML=`<div class="hero">${QM}<div class="solo" id="txt">${W.html}</div></div><div class="solo-by">${by}</div>`;
    const done=W.n*140+900;
    T(()=>$("txt").classList.add("lit"),done);
    T(()=>cam.querySelector(".by").classList.add("on"),done+300);
    dur=done+6500;
  }else{
    const step=Math.min(45,2600/d.t.split(/\s+/).length),W=words(d.t,step);
    cam.innerHTML=`<div class="hero">${QM}<div class="h">${d.h}</div></div><div class="card"><div class="qt"><p id="txt"></p></div>${by}</div>`;
    T(()=>sc.classList.add("s2"),2800);
    T(()=>{$("txt").innerHTML=W.html},3400);
    const done=3400+W.n*step+900;
    T(()=>$("txt").classList.add("lit"),done);
    T(()=>cam.querySelector(".by").classList.add("on"),done-300);
    dur=done+Math.max(6000,Math.min(14000,W.n*150));
  }
  progress(i,dur);
  T(()=>leave(cam,()=>{sc.className="scene";cam.innerHTML="";next()}),dur)}

function leave(el,then){burst();el.classList.add("out-z");T(then,950)}
function play(step){clearAll();cur=step;if(step===0)intro();else quote(step-1)}
function next(){if(!paused)play((cur+1)%(DATA.length+1))}
function hardJump(step){clearAll();$("intro").classList.remove("on","out-z");$("scene").className="scene";$("cam").innerHTML="";burst();play(step)}
T(()=>play(0),300);

addEventListener("keydown",e=>{const n=DATA.length+1;
  if(e.key==="ArrowLeft")hardJump((cur+1)%n);
  else if(e.key==="ArrowRight")hardJump((cur-1+n)%n);
  else if(e.key===" "){e.preventDefault();paused=!paused;
    if(paused){clearAll();barAnim&&barAnim.pause()}else{barAnim&&barAnim.play();hardJump((cur+1)%n)}}
  else if(e.key==="f"||e.key==="F")toggleFS()});
function toggleFS(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}catch(e){}}
addEventListener("click",toggleFS);
let idleT;addEventListener("mousemove",()=>{document.body.classList.remove("idle");clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add("idle"),3000)});
async function keepAwake(){try{if("wakeLock"in navigator)await navigator.wakeLock.request("screen")}catch(e){}}
keepAwake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});
</script>
</body>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="slide-version" content="2026-11-01-25">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آراء المتدربين — دورة حماية البيانات الشخصية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#070f2b;--bgA:#0d1b4b;--bgB:#081233;--bgC:#040a1e;
  --ink:#f4f7fd;--txt:#d5def0;--strong:#ffffff;--mute:#9fb0cf;
  --card:rgba(15,28,74,.9);--cardHi:rgba(255,255,255,.06);--cardBd:rgba(140,170,255,.16);--shadow:rgba(0,0,0,.4);
  --accent:#45d6a8;--qm:#45d6a8;--sep:rgba(255,255,255,.2);--grid:rgba(255,255,255,.03);
  --spot:#f2c46d;--spotTxt:#f6d48c;--spotBd:rgba(242,196,109,.7);--spotGlow:rgba(242,196,109,.22);
  --g1:#1d4fb0;--g2:#14866a;--g3:#3b2f9a;--gOp:1;--vign:rgba(2,5,16,.6);--star:190,225,255;
  --deptA:#1b8f6c;--deptB:#1d4fb0;
  --mini:rgba(255,255,255,.045);--miniBd:rgba(160,190,255,.12);--miniTxt:rgba(214,226,248,.42);--miniName:rgba(242,196,109,.45);--fadeC:rgba(7,15,43,.15);--fadeE:rgba(7,15,43,.55);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070f2b}}
:root[data-theme="dark"]{--bg:#070f2b}
html.light{color-scheme:light;
  --bg:#f2f5fb;--bgA:#ffffff;--bgB:#f2f5fb;--bgC:#e3eaf5;
  --ink:#0b1840;--txt:#2e3b5c;--strong:#0b1840;--mute:#5b6a8c;
  --card:rgba(255,255,255,.94);--cardHi:rgba(255,255,255,0);--cardBd:#e2e8f3;--shadow:rgba(20,40,90,.10);
  --accent:#1f9a74;--qm:#1f9a74;--sep:rgba(11,24,64,.16);--grid:rgba(11,24,64,.045);
  --spot:#c98a1a;--spotTxt:#a86d06;--spotBd:rgba(201,138,26,.7);--spotGlow:rgba(201,138,26,.16);
  --g1:#7ea6ff;--g2:#7fe0c2;--g3:#b9a8ff;--gOp:.35;--vign:rgba(120,145,190,.16);--star:40,90,170;
  --deptA:#1b8f6c;--deptB:#1d4fb0;
  --mini:rgba(255,255,255,.55);--miniBd:rgba(11,24,64,.08);--miniTxt:rgba(46,59,92,.45);--miniName:rgba(168,109,6,.5);--fadeC:rgba(242,245,251,.1);--fadeE:rgba(242,245,251,.55)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body.idle{cursor:none}

.vp{position:fixed;top:0;right:0;bottom:0;left:0;direction:ltr;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,var(--bgA) 0%,var(--bgB) 60%,var(--bgC) 100%)}
.glow{position:absolute;border-radius:50%}
.g1{width:80vw;height:80vw;left:-30vw;top:-36vw;opacity:calc(.7*var(--gOp));background:radial-gradient(circle,var(--g1) 0%,rgba(0,0,0,0) 66%)}
.g2{width:70vw;height:70vw;right:-26vw;bottom:-32vw;opacity:calc(.55*var(--gOp));background:radial-gradient(circle,var(--g2) 0%,rgba(0,0,0,0) 66%)}
.g3{width:46vw;height:46vw;left:30vw;top:20vh;opacity:calc(.3*var(--gOp));background:radial-gradient(circle,var(--g3) 0%,rgba(0,0,0,0) 66%)}
@keyframes d1{to{transform:translate(12vw,10vh)}}
@keyframes d2{to{transform:translate(-10vw,-8vh)}}
@keyframes d3{to{transform:translate(-16vw,12vh)}}
.grid{position:absolute;top:0;right:0;bottom:0;left:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:64px 64px}
canvas#sky{position:absolute;top:0;left:0;width:100%;height:100%}
.vign{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,var(--vign))}

.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;direction:rtl}

/* header */
.top{position:absolute;top:30px;left:64px;right:64px;height:92px;display:flex;align-items:center;justify-content:space-between;opacity:0;animation:rise 1s cubic-bezier(.2,.7,.2,1) .1s forwards}
.brand{display:flex;align-items:center}
.logo{height:74px;width:auto;display:block}
.logo-l{display:none}
.light .logo-d{display:none}
.light .logo-l{display:block}
.sep{width:1px;height:72px;background:var(--sep);margin:0 30px}
.prog{font-size:40px;font-weight:700;line-height:1.25;color:var(--ink)}
.tag{display:flex;align-items:center;font-size:22px;font-weight:600;color:var(--spotTxt);margin-top:4px}
.tag .ln{width:0;height:2px;background:var(--spot);margin-left:14px;animation:grow 1.2s cubic-bezier(.7,0,.2,1) .8s forwards}
@keyframes grow{to{width:48px}}
.deptL{font-size:34px;font-weight:700;color:var(--strong);padding:12px 30px 12px 34px;border-radius:18px;
  background-color:var(--card);border:1px solid var(--cardBd);border-right:5px solid var(--accent);box-shadow:0 10px 28px var(--shadow)}
@keyframes dp{50%{box-shadow:0 12px 50px rgba(27,143,108,.4),inset 0 0 0 1px rgba(255,255,255,.25)}}

/* cards */
.slot{opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.fl{width:100%;height:100%}
@keyframes flo{from{transform:translateY(-4px)}to{transform:translateY(5px)}}
.card{position:relative;width:100%;height:100%;border-radius:26px;padding:28px 32px 24px;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--cardHi),rgba(255,255,255,0));background-color:var(--card);
  border:1px solid var(--cardBd);box-shadow:0 10px 28px var(--shadow);
  transition:opacity .5s,border-color .6s,transform .5s}
.slot.swap .card{opacity:0!important;transform:translateY(14px)}
.dim .card{opacity:.82}
.on .card{border-color:var(--spotBd);border-width:2px}
.qm{width:40px;height:32px;flex:none;opacity:.9;margin-bottom:12px}
.qm path{fill:var(--qm)}
.on .qm path{fill:var(--spot)}

.txt{flex:1;font-size:19px;line-height:1.76;color:var(--txt)}
.short .card{justify-content:center;align-items:center;text-align:center;padding:44px 26px 16px}
.short .txt{flex:none;font-size:22px;line-height:1.5;font-weight:600;color:var(--strong)}
.short .qm{position:absolute;top:18px;right:20px;margin:0;width:30px;height:24px}
.w{display:inline}
@keyframes win{to{opacity:1;transform:none}}
.hl{color:var(--strong);font-weight:600}
.on .hl{color:var(--spotTxt)}
.by{display:flex;align-items:center;font-size:18px;font-weight:600;padding-top:14px;margin-top:12px;border-top:1px solid var(--cardBd);color:var(--strong)}
.short .by .ln{display:none}
.short .by{white-space:nowrap;border:0;padding-top:4px;margin-top:10px;font-size:17px;justify-content:center;text-align:center}
.by .ln{width:26px;height:2px;background:var(--accent);margin-left:12px}
.on .by .ln{background:var(--spot)}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grid)}
.bar i{display:block;height:100%;width:100%;background:var(--spot);transform-origin:right;transform:scaleX(0)}
.shine{position:absolute;top:0;bottom:0;width:160px;left:100%;background:linear-gradient(90deg,rgba(255,255,255,0),var(--spotGlow),rgba(255,255,255,0));pointer-events:none}
.shine{display:none}
@keyframes sh{from{transform:translateX(0)}to{transform:translateX(-900px)}}


#cards{position:absolute;top:126px;left:64px;right:64px;bottom:22px;display:flex;justify-content:space-between}
.col{width:353px;display:flex;flex-direction:column}
.col .slot{position:relative;margin-bottom:10px}
.col .slot:last-child{margin-bottom:0}
.slot.grow{flex:1}
.slot.grow .card{justify-content:space-between}
.slot .card{height:100%;padding:15px 22px 12px}
.qm{width:26px;height:21px;margin-bottom:5px}
.txt{font-size:16px;line-height:1.68}
.c .qm{width:18px;height:15px;margin-bottom:2px}
.c .txt{font-size:17px;line-height:1.55;font-weight:600;color:var(--strong);flex:none}
.c .by{border:0;padding-top:0;margin-top:5px;font-size:14px}
.c .by .ln{width:18px}
.by{font-size:15px;padding-top:8px;margin-top:8px}
.slot.swap .card{opacity:0!important}
.heart{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin:0 .1em}
.heart path{fill:#e5484d}
.txt[dir="ltr"]{text-align:right;font-family:"IBM Plex Sans Arabic","Segoe UI",Arial,sans-serif}

/* background: tilted mosaic of all comments drifting */
.bgtx{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none}
.mosaic{position:absolute;top:-35%;left:-12%;width:124%;height:170%;display:flex;justify-content:center;
  -webkit-transform:rotate(-9deg);transform:rotate(-9deg)}
.mcol{width:250px;margin:0 11px;flex:none;overflow:hidden}
.mtrack{-webkit-animation:mup 150s linear infinite;animation:mup 150s linear infinite}
.mcol.dn .mtrack{-webkit-animation-name:mdn;animation-name:mdn}
@-webkit-keyframes mup{from{-webkit-transform:translateY(0)}to{-webkit-transform:translateY(-50%)}}
@keyframes mup{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@-webkit-keyframes mdn{from{-webkit-transform:translateY(-50%)}to{-webkit-transform:translateY(0)}}
@keyframes mdn{from{transform:translateY(-50%)}to{transform:translateY(0)}}
.mini{direction:rtl;margin-bottom:22px;border-radius:18px;padding:16px 18px 14px;background:var(--mini);border:1px solid var(--miniBd)}
.mini q{display:block;quotes:none;font-size:14px;line-height:1.7;color:var(--miniTxt);overflow:hidden;max-height:95px}
.mini q:before,.mini q:after{content:none}
.mini b{display:block;margin-top:8px;font-size:12px;font-weight:600;color:var(--miniName)}
.mini svg{width:16px;height:13px;margin-bottom:6px;display:block}
.mini svg path{fill:var(--miniName)}
.bgfade{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,var(--fadeC) 0%,var(--fadeE) 75%)}
.bar{display:none}

.slot.rot{height:178px;flex:none}
.slot.rot .card{justify-content:center}
.slot.rot .card{-webkit-transition:opacity .6s;transition:opacity .6s}
.slot.rot.swap .card{opacity:0}
.c .txt{font-size:20px}
.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);direction:rtl;font-size:13px;color:var(--txt);
  background:var(--card);border:1px solid var(--cardBd);padding:8px 16px;border-radius:999px;transition:opacity .8s;z-index:5}
body.idle .hint{opacity:0}

/* theme toggle */
.tbtn{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--cardBd);background:var(--card);color:var(--spot);display:flex;align-items:center;justify-content:center;cursor:pointer;
  opacity:.65;box-shadow:0 6px 20px var(--shadow);transition:opacity .3s;-webkit-tap-highlight-color:transparent}
.tbtn:hover,.tbtn:focus-visible{opacity:1}
.tbtn svg{width:22px;height:22px}
.tbtn .moon{display:none}
.light .tbtn{color:#3b4f86}
.light .tbtn .sun{display:none}.light .tbtn .moon{display:block}
.switching *{-webkit-transition:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.glow,.fl{animation:none!important}}
</style>
</head>

 [{n:"رائد عبدالرحمن عبدالكريم الديحان",t:"كان محتوى جيدًا، وأعجبني جدًا أسلوب تقديم الورشة من حيث التنوع في الأساليب مثل [المقاطع المرئية المتفاعلة]، وتنوع أساليب الأنشطة مثل [البطاقات والسيناريوهات التفاعلية]، والتي بدورها [كسرت حاجز الملل] لو كان التقديم كله مقاطع مرئية. [أفكار رائعة وأساليب متنوعة]، مع الشكر والتقدير لكم على توفير هذه الورش في مجال حماية البيانات الشخصية وحوكمة البيانات، وسعيد بتمكني من الاستفادة منها.",L:1,g:1},

  {n:"عبدالسلام محمد مطلق العتيبي",t:"نشكر لكم تعاونكم على هذه [الدورة المتكاملة]، حيث [غطّت جميع المتطلبات في النظام]، وأيضًا الممارسات التي كانت غائبة بشكل عام."},
  {n:"لطيفة سالم علي الحربي",t:"المادة العلمية [ثرية ومليئة بالمعلومات المفيدة] وحديثة."},

 [{n:"جود حمود القرعاني",t:"أحد أهم محركات النجاح التقني هو [الامتثال لحوكمة البيانات وحماية خصوصيتها]. سعدت بإتمام دورة حماية البيانات الشخصية (PDPL) المقدمة من سدايا: [فهم الأطر التنظيمية لنظام حماية البيانات الشخصية]، و[التمييز العملي بين أدوار جهة التحكم وجهة المعالجة]. خطوة جديدة ومعرفة أعمق تسهم في [تعزيز الأمان والامتثال الرقمي].",L:1,g:1},

  ],
 [{n:"بدر الحبشي",t:"كانت [تجربة مثرية قيّمة] أسهمت في [تعزيز فهمي لنظام حماية البيانات الشخصية ولوائحه التنفيذية]، وأُشيد [بالتنوع في تقديم المحتوى] من خلال المقاطع المرئية والأنشطة التفاعلية.",g:1},

function $(id){return document.getElementById(id);}
function addC(el,c){if(el&&(" "+el.className+" ").indexOf(" "+c+" ")<0)el.className+=" "+c;}
function remC(el,c){if(el)el.className=(" "+el.className+" ").replace(new RegExp(" "+c+" ","g")," ").replace(/^\s+|\s+$/g,"");}
function setT(el,v){el.style.webkitTransform=v;el.style.transform=v;}
function setTr(el,v){el.style.webkitTransition=v;el.style.transition=v;}


/* theme */
var root=document.documentElement;
function setTheme(t){if(t==="light"){addC(root,"light");root.setAttribute("data-theme","light");}else{remC(root,"light");root.setAttribute("data-theme","dark");}
  try{localStorage.setItem("pdp-theme",t);}catch(e){}}
var saved=null;try{saved=localStorage.getItem("pdp-theme");}catch(e){}
var qs=/theme=(light|dark)/.exec(location.search);
setTheme(qs?qs[1]:(saved||"dark"));
$("tbtn").addEventListener("click",function(e){e.stopPropagation();addC(root,"switching");setTimeout(function(){remC(root,"switching");},80);setTheme((" "+root.className+" ").indexOf(" light ")>-1?"dark":"light");});
var stage=$("stage");
function fit(){var w=window.innerWidth||document.documentElement.clientWidth,h=window.innerHeight||document.documentElement.clientHeight;
  setT(stage,"translate(-50%,-50%) scale("+Math.min(w/1600,h/900)+")");}
window.addEventListener("resize",fit);fit();setTimeout(fit,500);

var QM='<svg class="qm" viewBox="0 0 100 80"><path d="M0 80V48C0 22 14 6 40 0l5 10C30 15 23 25 22 38h20v42H0zm56 0V48C56 22 70 6 96 0l4 10c-15 5-22 15-23 28h20v42H56z"/></svg>';
function words(t,base,step){var hl=false,g=-1,out=[],p=t.split(/\s+/);
  for(var k=0;k<p.length;k++){var w=p[k];if(w.indexOf("[")>-1){hl=true;g++;}
    var d=Math.round(base+k*step),st="-webkit-animation-delay:"+d+"ms;animation-delay:"+d+"ms";
    if(hl)st+=";-webkit-transition-delay:"+(g*350)+"ms;transition-delay:"+(g*350)+"ms";
    out.push('<span class="w'+(hl?" hl":"")+'" style="'+st+'">'+w.replace(/[\[\]]/g,"")+'</span>');
    if(w.indexOf("]")>-1)hl=false;}
  return out.join(" ");}

var HEART='<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3 1.7-1.8 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
function inner(d){return '<div class="card'+(d.L?'':' c')+'">'+QM+'<div class="txt"'+(d.ltr?' dir="ltr"':'')+'>'+words(d.t,0,0).replace("♥",HEART)+'</div>'+
  '<div class="by"><span class="ln"></span>'+d.n+'</div><div class="bar"><i></i></div></div>';}
var FIX=[],POOL=[];
for(var ci=0;ci<COLS.length;ci++)for(var k=0;k<COLS[ci].length;k++){if(k===0)FIX.push(COLS[ci][k]);else POOL.push(COLS[ci][k]);}
/* each column: one fixed long comment + two rotating short-comment slots */
var html="",ROT=[],qi=0,PER=2;
for(var c=0;c<FIX.length;c++){var dl=250+c*120;
  html+='<div class="col"><div class="slot grow" style="-webkit-animation-delay:'+dl+'ms;animation-delay:'+dl+'ms">'+inner(FIX[c])+'</div>';
  for(var r=0;r<PER;r++){var id="r"+c+"_"+r,d2=dl+(r+1)*240;
    html+='<div class="slot rot" id="'+id+'" style="-webkit-animation-delay:'+d2+'ms;animation-delay:'+d2+'ms">'+inner(POOL[qi])+'</div>';
    ROT.push({id:id,item:POOL[qi]});qi++;}
  html+='</div>';}
$("cards").innerHTML=html;
var WAIT=POOL.slice(qi);
function fitCard(slot){var card=slot.getElementsByTagName("div")[0],t=slot.querySelector(".txt"),fs=20;
  t.style.fontSize=fs+"px";while(card.scrollHeight>card.clientHeight+1&&fs>15){fs--;t.style.fontSize=fs+"px";}}
for(var z=0;z<ROT.length;z++)fitCard($(ROT[z].id));
setTimeout(function(){for(var z=0;z<ROT.length;z++)fitCard($(ROT[z].id));},1500); /* after web font loads */

/* rotation: every few seconds one slot fades out and takes the next waiting comment */
var reloadPending=false,startedAt=new Date().getTime(),turn=0,ORDER=[0,3,5,6,1,2,4,7];
function rotate(){if(!WAIT.length)return;
  var R=ROT[ORDER[turn%ORDER.length]];turn++;var el=$(R.id);addC(el,"swap");
  setTimeout(function(){WAIT.push(R.item);R.item=WAIT.shift();el.innerHTML=inner(R.item);fitCard(el);void el.offsetWidth;remC(el,"swap");},600);}
setInterval(rotate,7000);

/* spotlight removed */
/* background mosaic: every comment as a ghost card, columns drifting in opposite directions */
(function(){var all=[];for(var a=0;a<COLS.length;a++)for(var b=0;b<COLS[a].length;b++)all.push(COLS[a][b]);
  var QS='<svg viewBox="0 0 100 80"><path d="M0 80V48C0 22 14 6 40 0l5 10C30 15 23 25 22 38h20v42H0zm56 0V48C56 22 70 6 96 0l4 10c-15 5-22 15-23 28h20v42H56z"/></svg>';
  var h='<div class="mosaic">',per=8;
  for(var c=0;c<8;c++){var seg="";
    for(var k=0;k<per;k++){var d=all[(c*5+k*3)%all.length];
      seg+='<div class="mini">'+QS+'<q'+(d.ltr?' dir="ltr"':'')+'>'+d.t.replace(/[\[\]]/g,"").replace("♥","")+'</q><b>'+d.n+'</b></div>';}
    var dur=130+(c%3)*25;
    h+='<div class="mcol'+(c%2?' dn':'')+'"><div class="mtrack" style="-webkit-animation-duration:'+dur+'s;animation-duration:'+dur+'s;-webkit-animation-delay:-'+(c*19)+'s;animation-delay:-'+(c*19)+'s">'+seg+seg+'</div></div>';}
  $("bgtx").innerHTML=h+'</div>';})();


/* fullscreen, cursor, wake */
function toggleFS(){var d=document,el=d.documentElement;try{
  if(!(d.fullscreenElement||d.webkitFullscreenElement)){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
  else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);}}catch(e){}}
document.addEventListener("click",toggleFS);
var idleT;document.addEventListener("mousemove",function(){remC(document.body,"idle");clearTimeout(idleT);idleT=setTimeout(function(){addC(document.body,"idle");},3000);});
try{if(navigator.wakeLock&&navigator.wakeLock.request)navigator.wakeLock.request("screen").then(null,function(){});}catch(e){}

/* auto-update */
var myVer=(document.querySelector('meta[name="slide-version"]')||{}).content;
function checkUpdate(){try{var x=new XMLHttpRequest();x.open("GET",location.pathname+"?v="+new Date().getTime(),true);
  x.onload=function(){var m=/name="slide-version" content="([^"]+)"/.exec(x.responseText||"");if(x.status==200&&m&&m[1]!==myVer)reloadPending=true;};x.send();}catch(e){}}
setInterval(checkUpdate,180000);
setInterval(function(){if(reloadPending)location.reload();},60000);
setInterval(function(){if(new Date().getTime()-startedAt>6*3600000)reloadPending=true;},600000);
})();
</script>
